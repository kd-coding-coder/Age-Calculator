<!DOCTYPE html>
<html>
    <head>
        <title>Age Calculator</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <h2 class="text-center">Age Calculator</h2>
            <form id="ageForm">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your Name" required>
                </div>

                <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="data" id="dob" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Calculate Age</button>

            </form>

            <div id="ageResult" class="text-center"></div>
        </div>

        <style>
            body{
                background-color: rgb(238, 250, 250);
                padding: 20px;
            }

            .container{
                max-width: 500px;
                margin-top: 50px;
                padding: 20px;
                background-color: rgb(202, 218, 219);
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(rgb(192, 228, 255));
            }

            .form-group{
                margin-bottom: 15px;
            }

            #ageResult{
                margin-top: 20px;
                font-size: 1.2rem;
                font-weight: bold;
            }
        </style>


        <script>
            function calculateAge(){
                const name = document.getElementById("name").value;
                const dob = new Date(document.getElementById("dob").value);
                const today = new Date();

                let ageYears = today.getFullYear() - dob.getFullYear();
                if (today.getMonth() < dob.getMonth() || (today.getMonth() === dob.getMonth() && today.getDate < dob.getDate())){
                    ageYears--;  //Adjust if the birthday hasn't occured yet this year
                }

                let ageMonths = (today.getFullYear() - dob.getFullYear()) * 12 + today.getMonth() - dob.getMonth();
                if (today.getDate() < dob.getDate()){
                    ageMonths--;
                }
                

                //Calculate age in days (total number of days)
                const ageDays = Math.floor((today - dob) / (1000 * 60 * 60 * 24));

                const resultDiv = document.getElementById("ageResult");
                resultDiv.innerHTML = `<p>Hello, ${name}!</p>
                <p>You are:</p>
                <ul> 
                    <li>${ageYears} years old. </li>
                    <li>${ageMonths} months old. </li>
                    <li>${ageDays} days old. </li>
                    </ul>`;

                }

                document.getElementById("ageForm").addEventListener("submit", function(event){
                    event.preventDefault();
                    calculateAge();
                })
                    
                

        </script>
    </body>
</html>
